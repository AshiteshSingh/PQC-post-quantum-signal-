<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="referrer" content="no-referrer">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark-theme">
  <!-- Minimalist Top Navigation -->
  <header class="navbar" id="main-header">
    <div class="nav-left">
      <div class="user-avatar" id="header-avatar">?</div>
      <div class="user-info">
        <span class="user-name" id="display-peer-name">Direct Chat</span>
        <span class="user-status" id="display-peer-status">Offline</span>
      </div>
    </div>

    <div class="nav-right">
      <div class="session-timer" id="ttl-container" title="Session time remaining">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span id="ttl-display">60:00</span>
      </div>

      <button class="nav-btn clear-btn hidden" id="btn-clear-chat" title="Clear chat for both users">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Clear chat</span>
      </button>
    </div>
  </header>

  <!-- Chat Viewport -->
  <main class="chat-layout">
    <section class="messages-viewport" id="messages-container">
      
      <!-- Connect Peer Bar (Shown before a peer is connected) -->
      <div class="peer-pairing-card" id="peer-pairing-box">
        <h3>New Chat</h3>
        <p class="pairing-sub">Logged in as <strong id="current-user-tag" class="text-user">...</strong></p>

        <form id="connect-peer-form" class="pairing-form">
          <input 
            type="text" 
            id="target-peer-input" 
            class="form-input" 
            placeholder="Enter username to chat..." 
            required 
            maxlength="25"
          >
          <button type="submit" class="submit-btn-inline" id="btn-call-peer">
            <span>Start</span>
          </button>
        </form>

        <div class="online-peers-container">
          <span class="online-label">Available users</span>
          <div class="online-chips-list" id="online-users-list">
            <span class="empty-hint">No other users online</span>
          </div>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="messages-list hidden" id="messages-list"></div>
    </section>
  </main>

  <!-- Message Composer -->
  <footer class="composer-bar">
    <div class="composer-container">
      <input 
        type="text" 
        id="chat-input" 
        class="chat-input" 
        placeholder="Type a message..." 
        autocomplete="off" 
        disabled
      >
      <button class="send-btn" id="btn-send-message" disabled aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </footer>

  <!-- Username Setup Modal -->
  <div class="modal-backdrop" id="join-modal">
    <div class="modal-card">
      <h2>Welcome</h2>
      <p class="modal-subtitle">Choose a username to start chatting.</p>

      <form id="join-form">
        <div class="form-group">
          <input type="text" id="input-username" class="form-input" placeholder="Your username" required autofocus maxlength="25">
        </div>
        <button type="submit" class="submit-btn" id="btn-join-session">
          <span>Continue</span>
        </button>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="/static/app.js"></script>
</body>
</html>
