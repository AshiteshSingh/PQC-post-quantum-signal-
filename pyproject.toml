[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-ratchet"
version = "0.1.0"
description = "Research-Grade Post-Quantum Cryptographic Transport and KEM Double Ratchet Protocol (FIPS 203 ML-KEM-768 + FIPS 204 ML-DSA-65)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Principal Quantum Cryptographer & Systems Architect" }
]
keywords = [
    "post-quantum",
    "cryptography",
    "pqc",
    "ml-kem",
    "ml-dsa",
    "kyber",
    "dilithium",
    "double-ratchet",
    "e2ee",
    "tunnel",
    "wireguard",
    "nist-pqc"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
pq-ratchet = "pq_ratchet.cli:main"

[tool.setuptools.packages.find]
include = ["pq_ratchet*"]
